  <style>
    :root {
      --emerald-deep: #042d1e;

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;

      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Landscape zero-scroll viewport lock */
      height: 100vh;
      width: 100vw;
    }

    .font-arabic {
      font-family: 'Amiri', serif;
      line-height: 2.1;
    }

    /* Inspired Emerald & Golden Dawn Scenic Background */
    .scenic-canvas {
      background: radial-gradient(circle at 50% 82%, rgba(250, 204, 21, 0.36) 0%, rgba(16, 107, 73, 0.45) 36%, rgba(4, 45, 30, 0.96) 78%),
                  linear-gradient(180deg, #032619 0%, #074730 55%, #0e6343 100%);
    }

    /* Islamic Geometric Lattice Overlay in Corners */
    .islamic-lattice {
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d4af37' stroke-width='0.8' stroke-opacity='0.22'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z'/%3E%3Crect x='15' y='15' width='30' height='30'/%3E%3Ccircle cx='30' cy='30' r='8'/%3E%3C/g%3E%3C/svg%3E");
    }

    /* Gold Frame Glow */
    .gold-border {
      border: 1.5px solid rgba(212, 175, 55, 0.55);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.14), inset 0 0 18px rgba(212, 175, 55, 0.08);
    }

    .gold-card {
      background: rgba(5, 44, 30, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    .gold-card:hover {
      border-color: rgba(247, 220, 121, 0.75);
    }

    /* Gentle Leaf Sway Animation */
    @keyframes swayLeaf {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.5deg); }
    }
    .leaf-sway {
      transform-origin: top left;
      animation: swayLeaf 6s ease-in-out infinite;
    }
    .leaf-sway-right {
      transform-origin: top right;
      animation: swayLeaf 7s ease-in-out infinite reverse;
    }

    /* Sun Glow Pulse */
    @keyframes sunPulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    .dawn-glow {
      animation: sunPulse 5s ease-in-out infinite;
    }

    /* Custom subtle internal scroll only if smaller screen requires */
    .panel-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .panel-scroll::-webkit-scrollbar-track {

    }

    /* Tab Active Indicator */

    }
    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

  <script>
    /* ==========================================================================
       1. AUDIO ENGINE (TONE.JS SYNTHESIZED ISLAMIC CHIMES & INTERACTION SFX)
       No external audio URLs used; pure Web Audio synthesis for instant feedback.
       ========================================================================== */
    let soundEnabled = true;
    let synth = null;
    let chordSynth = null;

    function initAudio() {
      if (!synth && typeof Tone !== 'undefined') {
        synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "triangle" },
          envelope: { attack: 0.02, decay: 0.25, sustain: 0.1, release: 0.8 }
        }).toDestination();
        synth.volume.value = -10;

        chordSynth = new Tone.PluckSynth({
          attackNoise: 1,
          dampening: 3200,
          resonance: 0.92
        }).toDestination();
        chordSynth.volume.value = -8;
      }
    }

    async function playSFX(type) {
      if (!soundEnabled) return;
      try {
        if (Tone.context.state !== 'running') {
          await Tone.start();
        }
        initAudio();
        if (!synth) return;

        const now = Tone.now();
        if (type === 'click') {
          synth.triggerAttackRelease("E5", "32n", now);
        } else if (type === 'tab') {
          // Gentle Hijaz/Islamic scale pluck
          chordSynth.triggerAttack("D4", now);
          chordSynth.triggerAttack("Eb4", now + 0.06);
          chordSynth.triggerAttack("G4", now + 0.12);
        } else if (type === 'correct') {
          synth.triggerAttackRelease(["D5", "F#5", "A5"], "16n", now);
          synth.triggerAttackRelease(["D6"], "8n", now + 0.12);
        } else if (type === 'wrong') {
          synth.triggerAttackRelease(["Eb4", "D4"], "16n", now);
        } else if (type === 'niat') {
          // Melodic chime for Dalil / Niat reveal
          const notes = ["D4", "G4", "A4", "Bb4", "D5"];
          notes.forEach((n, i) => synth.triggerAttackRelease(n, "16n", now + i * 0.09));
        }
      } catch (e) {
        // Silently ignore audio block if browser hasn't registered gesture yet
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sfxIconOn').classList.toggle('hidden', !soundEnabled);
      document.getElementById('sfxIconOff').classList.toggle('hidden', soundEnabled);
      if (soundEnabled) playSFX('correct');
      showToast(soundEnabled ? "Bunyi SFX Diaktifkan 🔊" : "Bunyi SFX Dimatikan 🔇");
    }

    function showToast(msg, icon = "✨") {
      const box = document.getElementById('toastBox');
      document.getElementById('toastMsg').textContent = msg;
      document.getElementById('toastIcon').textContent = icon;
      box.classList.remove('hidden');
      box.classList.add('flex');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
        box.classList.remove('flex');
      }, 2400);
    }

    /* ==========================================================================
       2. DATA KANDUNGAN (HANYA PENYATAAN MASALAH & 6 OBJEKTIF PEMBELAJARAN)
       ========================================================================== */
    const appState = {
      section: 'objektif', // 'masalah' | 'objektif'
      activeIndex: 0
    };

    const penyataanMasalahData = [
      {
        num: "Isu 1",
        title: "Kekeliruan antara Syarat Wajib dan Syarat Sah",
        short: "Syarat Wajib vs Syarat Sah",
        icon: "⚖️",
        isu: "Murid sering keliru membezakan antara syarat wajib berpuasa (seperti baligh dan mampu) dengan syarat sah berpuasa (seperti mumayyiz dan suci daripada haid/nifas), termasuk status sah puasa bagi kanak-kanak yang belum baligh.",
        penjelasan: [
          { label: "Syarat Wajib (Baligh & Mampu)", text: "Menentukan sama ada seseorang itu berdosa jika meninggalkan puasa. Kanak-kanak belum baligh tidak wajib berpuasa." },
          { label: "Syarat Sah (Mumayyiz & Suci Haid/Nifas)", text: "Menentukan sama ada ibadah puasa itu diterima/sah. Kanak-kanak mumayyiz yang belum baligh tetap SAH puasanya." }
        ]
      },
      {
        num: "Isu 2",
        title: "Salah Faham Perkara Membatalkan Puasa",
        short: "Sengaja vs Tidak Sengaja",
        icon: "🚫",
        isu: "Murid kurang jelas tentang perbezaan antara perbuatan yang tidak sengaja (seperti muntah atau termakan secara tidak sengaja) dengan perbuatan sengaja, serta konsep memasukkan sesuatu ke dalam rongga terbuka.",
        penjelasan: [
          { label: "Sengaja vs Tidak Sengaja", text: "Makan, minum atau muntah dengan SENGAJA membatalkan puasa. Jika berlaku secara TIDAK SENGAJA / terlupa, puasa tetap sah." },
          { label: "Konsep Rongga Terbuka", text: "Memasukkan sesuatu benda ke dalam rongga terbuka (mulut, hidung, telinga, qubul atau dubur) secara sengaja membatalkan puasa." }
        ]
      },
      {
        num: "Isu 3",
        title: "Penghayatan Amalan Sunat & Adab",
        short: "Amalan Sunat & Istiqamah",
        icon: "🌙",
        isu: "Murid cenderung melaksanakan ibadah puasa sekadar menahan lapar dan dahaga tanpa menghayati amalan sunat (seperti bersahur, menyegerakan berbuka, bertadarus) serta nilai adab dan istiqamah dalam kehidupan seharian.",
        penjelasan: [
          { label: "Menghidupkan Amalan Sunat", text: "Melazimi bersahur, menyegerakan berbuka puasa apabila masuk waktu Maghrib serta bertadarus al-Quran." },
          { label: "Adab & Istiqamah", text: "Menjaga tutur kata, mengawal kemarahan, bersedekah dan berakhlak mulia secara berterusan." }
        ]

    ];

    const objektifData = [
      {
        num: "Objektif 1",
        title: "Maksud Puasa Ramadan",
        short: "Maksud Puasa",
        render: () => `
          <div class="flex flex-col justify-between h-full gap-3">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-amber-300">Objektif Pembelajaran 1</span>
              <h2 class="text-lg sm:text-xl font-extrabold text-white mt-0.5">Menyatakan Maksud Puasa Ramadan Dengan Tepat</h2>
            </div>
            <div class="p-4 sm:p-5 rounded-2xl bg-emerald-950/85 border border-amber-400/45 my-auto">
              <p class="text-base sm:text-lg md:text-xl font-bold text-white leading-relaxed text-center">
                "Menahan diri daripada melakukan <span class="text-amber-300">perkara-perkara yang membatalkan puasa</span> bermula dari <span class="text-amber-300">terbit fajar</span> hingga <span class="text-amber-300">terbenam matahari</span> berserta <span class="text-amber-300">niat</span>."
              </p>
            </div>
            <div class="grid grid-cols-3 gap-2.5 text-center text-xs sm:text-sm">
              <div class="p-3 rounded-xl bg-emerald-900/70 border border-emerald-500/30">
                <div class="font-extrabold text-amber-300">1. Masa Mula</div>
                <div class="text-emerald-100 mt-0.5">Terbit fajar (Subuh)</div>
              </div>
              <div class="p-3 rounded-xl bg-emerald-900/70 border border-emerald-500/30">
                <div class="font-extrabold text-amber-300">2. Masa Tamat</div>
                <div class="text-emerald-100 mt-0.5">Terbenam matahari (Maghrib)</div>
